receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 384, spike_limit_mib: 96}
  resource:
    attributes:
      - {key: cloud.provider, value: gcp, action: upsert}
  batch: {}
exporters:
  googlecloud:
    project: "${env:GCP_PROJECT_ID}"
    log:
      default_log_name: opentelemetry.io/collector-exported-log
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  prometheus: {endpoint: 0.0.0.0:8889}
  otlphttp/loki: {endpoint: http://loki:3100/otlp}
extensions:
  health_check: {endpoint: 0.0.0.0:13133}
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp/jaeger, googlecloud]}
    metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheus, googlecloud]}
    logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/loki, googlecloud]}
