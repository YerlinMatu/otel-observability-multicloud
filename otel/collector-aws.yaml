receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 384, spike_limit_mib: 96}
  resource:
    attributes:
      - {key: cloud.provider, value: aws, action: upsert}
      - {key: deployment.environment, value: production, action: insert}
  batch: {}
exporters:
  awsxray: {region: "${env:AWS_REGION}"}
  awscloudwatchlogs:
    log_group_name: /otel/microservices
    log_stream_name: collector
    region: "${env:AWS_REGION}"
  # CloudWatch EMF: convierte métricas OTLP en Embedded Metric Format y las
  # publica como métricas nativas de CloudWatch, sin necesitar un Prometheus
  # adicional corriendo en ECS. resource_to_telemetry_conversion conserva
  # service.name/deployment.environment como dimensiones.
  awsemf:
    region: "${env:AWS_REGION}"
    namespace: ObservabilityLab
    log_group_name: /otel/microservices/metrics
    log_stream_name: collector
    resource_to_telemetry_conversion:
      enabled: true
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [awsxray]}
    metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [awsemf]}
    logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [awscloudwatchlogs]}
