receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 384, spike_limit_mib: 96}
  resource:
    attributes:
      - {key: cloud.provider, value: gcp, action: upsert}
      - {key: deployment.environment, value: production, action: insert}
  batch: {}
exporters:
  googlecloud:
    project: ${env:GCP_PROJECT_ID}
  otlp/jaeger:
    endpoint: jaeger-collector.observability.svc.cluster.local:4317
    tls: {insecure: true}
  prometheus: {endpoint: 0.0.0.0:8889}
extensions:
  health_check: {endpoint: 0.0.0.0:13133}
service:
  extensions: [health_check]
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp/jaeger, googlecloud]}
    metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheus, googlecloud]}
    logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [googlecloud]}

