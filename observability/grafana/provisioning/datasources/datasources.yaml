apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
          url: 'http://localhost:16686/trace/$${__value.raw}'
          urlDisplayLabel: Abrir traza en Jaeger
  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
